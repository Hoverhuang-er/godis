# Godis Standalone Configuration
# This is a TOML-format configuration file for standalone mode.
# Copy this file as standalone.toml in your working directory, or set
# the CONFIG environment variable to point to it.
#
# Usage:
#   CONFIG=standalone.toml ./godis
#   or simply place standalone.toml in the working directory.

config_mode = "standalone"

[server]
# Bind address for the Redis service
bind = "0.0.0.0"

# Port to listen on
port = 6379

# Working directory for AOF, RDB, and cluster data
# dir = "/opt/godis"

# Maximum number of client connections
maxclients = 128

# Number of databases
databases = 16

# Use gnet event-loop TCP server for better IO performance
# use_gnet = false

[aof]
# Enable AOF persistence
# Note: Godis RDB is generated by AOF rewriting.
# Enable AOF if you need persistence or replication.
appendonly = false

# AOF filename (stored in the directory specified by server.dir)
appendfilename = "appendonly.aof"

# Fsync policy: "always", "everysec", or "no"
appendfsync = "everysec"

# Use RDB preamble in AOF rewrite (hybrid persistence)
aof_use_rdb_preamble = true

# RDB filename
dbfilename = "test.rdb"

[security]
# Password for client authentication
# requirepass = "yourpassword"

# Password for master authentication (replication)
# masterauth = "masterpassword"

[replication]
# Advertised address for NAT traversal
# announce_host = "5.5.5.5"

# Slave announcement port
# slave_announce_port = 6379

# Replication timeout in seconds
# repl_timeout = 60

[cluster]
# Enable worker pool for parallel relay processing (cluster mode only)
worker_pool = true

# Enable parallel relay for multi-node transactions (cluster mode only)
relay_parallel = true

# Cluster identifier. When cluster mode is enabled at runtime (hot-switch),
# the first node generates this id and writes it back here automatically.
# Joining nodes must use the same value. Leave empty for standalone mode.
# cluster_id = ""

# Health-probe interval in seconds (default 15)
# heartbeat_interval = 15

# Failover after this many consecutive missed probes (default 10)
# failover_max_failures = 10

# Max major-version gap between nodes during OSS snapshot sync (default 3)
# max_version_gap = 3

# Publish/pull OSS snapshots every N seconds (default 60)
# snapshot_interval = 60

# Replicate data between nodes via OSS (requires [oss] section)
# sync_via_oss = false

[oss]
# S3-compatible object storage (unused unless cluster.sync_via_oss is true)
# endpoint = "127.0.0.1:9000"
# access_key_id = "minioadmin"
# secret_access_key = "minioadmin"
# bucket = "godis-cluster"
# prefix = ""
# region = "us-east-1"
# use_ssl = false
# force_path_style = true

[azure]
# Azure Entra ID (formerly Azure AD) authentication
# Enable to accept Entra ID access tokens as AUTH credentials
# entra_tenant_id = "your-tenant-id"
# entra_app_id = "your-app-id"

[slowlog]
# Commands slower than this threshold (microseconds) are logged
log_slower_than = 10000

# Maximum length of the slow log
max_len = 128

[monitoring]
# Enable Prometheus metrics endpoint (enabled by default)
prometheus_enabled = true

# Prometheus metrics HTTP server port
prometheus_port = 9121

[http_api]
# Enable the HTTP API server for programmatic access
enabled = true

# HTTP API bind host (use 0.0.0.0 to allow external access)
host = "127.0.0.1"

# HTTP API listen port
port = 63790

[web]
# Web dashboard listen port
port = 63800

# Anti-Monero-mining: rename or disable dangerous commands.
# These defaults protect against cryptojacking attacks.
[security.rename_command]
# Disable replication takeover vector (Monero mining attacks use SLAVEOF)
SLAVEOF = ""
REPLICAOF = ""
# Rename destructive commands to random strings to prevent accidental/malicious use
FLUSHALL = "b840fc02d52404542994ccf15b82f2c0"
FLUSHDB = "b840fc02d52404542994ccf15b82f2c0"

[ai]
# Embedding backend used by the knowledge-base commands (RAG.*, WIKI.*,
# MEMORY.*, LLMCACHE.*). It runs inside the server, so redis-cli can issue a
# knowledge-base query directly.
#
#   local = deterministic pure-Go embedder. Offline, no API key, no network.
#           Lexical (unigrams + character trigrams), not truly semantic.
#   http  = any OpenAI-compatible /embeddings endpoint (OpenAI, Ollama, vLLM,
#           LM Studio, hosted gateways). Real semantics; requires the settings
#           below and network access at query time.
embed_provider = "local"

# Vector length of the local embedder.
embed_local_dim = 512

# HTTP provider settings (only used when embed_provider = "http").
# embed_base_url = "https://api.openai.com/v1"
# embed_api_key = ""
# embed_model = "text-embedding-3-small"
# embed_dim = 1536
# embed_timeout = 30

# Chunking bounds for RAG.INGEST, in characters.
chunk_size = 800
chunk_overlap = 120
